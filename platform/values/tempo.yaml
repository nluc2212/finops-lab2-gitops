fullnameOverride: tempo
tempo:
  retention: 24h  # the lab is deleted every evening
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { cpu: '1', memory: 2Gi }  # 700Mi was OOMKilled under trace search (26/11): AI got no traces
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
persistence:
  enabled: true
  size: 5Gi
  storageClassName: managed-csi-shared
