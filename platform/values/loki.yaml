fullnameOverride: loki
deploymentMode: SingleBinary
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index: { prefix: index_, period: 24h }
  limits_config:
    retention_period: 48h
  useTestSchema: false
singleBinary:
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 200Mi }
    limits: { cpu: 500m, memory: 600Mi }
  persistence:
    enabled: true
    size: 5Gi
    storageClass: managed-csi-shared
# everything below is off to fit a 3 x 2 vCPU cluster
chunksCache: { enabled: false }
resultsCache: { enabled: false }
gateway: { enabled: false }
minio: { enabled: false }
lokiCanary: { enabled: false }
test: { enabled: false }
backend: { replicas: 0 }
read: { replicas: 0 }
write: { replicas: 0 }
ingester: { replicas: 0 }
querier: { replicas: 0 }
queryFrontend: { replicas: 0 }
queryScheduler: { replicas: 0 }
distributor: { replicas: 0 }
compactor: { replicas: 0 }
indexGateway: { replicas: 0 }
bloomCompactor: { replicas: 0 }
bloomGateway: { replicas: 0 }
