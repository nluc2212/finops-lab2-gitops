apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: managed-csi-shared
provisioner: disk.csi.azure.com
parameters:
  skuName: StandardSSD_LRS
  tags: customer=shared,env=lab2,owner=finops-lab2   # disk shows under the right customer in OptScale
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: managed-csi-beta
provisioner: disk.csi.azure.com
parameters:
  skuName: StandardSSD_LRS
  tags: customer=beta,env=lab2,owner=finops-lab2   # disk shows under the right customer in OptScale
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
