# App of apps: everything under apps/ is synced by Argo CD from the private GitOps repo (lab2).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:nluc2212/finops-lab2-gitops.git
    targetRevision: HEAD
    path: apps
  destination: { server: https://kubernetes.default.svc, namespace: argocd }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
