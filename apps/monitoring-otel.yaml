apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-otel
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    notifications.argoproj.io/subscribe.on-health-degraded.ai-rca: ""
    notifications.argoproj.io/subscribe.on-sync-failed.ai-rca: ""
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  destination: { server: https://kubernetes.default.svc, namespace: monitoring }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
  sources:
    - repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
      chart: opentelemetry-collector
      targetRevision: 0.178.3
      helm:
        releaseName: otel-collector
        valueFiles: [$values/platform/values/otel-collector.yaml]
    - repoURL: git@github.com:nluc2212/finops-lab2-gitops.git
      targetRevision: HEAD
      ref: values
