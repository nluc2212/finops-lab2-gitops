apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cust-alpha
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    notifications.argoproj.io/subscribe.on-health-degraded.ai-rca: ""
    notifications.argoproj.io/subscribe.on-sync-failed.ai-rca: ""
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  destination: { server: https://kubernetes.default.svc, namespace: cust-alpha }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true, RespectIgnoreDifferences=true]
  # the remediation bot scales / restarts deployments: not drift for selfHeal
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers: [/spec/replicas, /spec/template/metadata/annotations/kubectl.kubernetes.io~1restartedAt]
  source:
    repoURL: git@github.com:nluc2212/finops-lab2-gitops.git
    targetRevision: HEAD
    path: cust-alpha
