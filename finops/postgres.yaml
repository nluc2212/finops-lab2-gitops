apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: postgres }
spec:
  storageClassName: managed-csi-shared
  accessModes: ["ReadWriteOnce"]
  resources: { requests: { storage: 2Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - { name: POSTGRES_USER, value: finops }
            - { name: POSTGRES_PASSWORD, value: finops }
            - { name: POSTGRES_DB, value: finops }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ containerPort: 5432 }]
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
          readinessProbe: { exec: { command: ["pg_isready", "-U", "finops"] }, periodSeconds: 10 }
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { cpu: 300m, memory: 256Mi }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: postgres } }
---
apiVersion: v1
kind: Service
metadata: { name: postgres }
spec:
  selector: { app: postgres }
  ports: [{ port: 5432 }]
