# Remediation bot (ai-rca in ns finops): only what the approved actions need, only in this namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: ai-rca-remediation }
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, patch]
  - apiGroups: [apps]
    resources: [deployments/scale]
    verbs: [get, update, patch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: ai-rca-remediation }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: ai-rca-remediation }
subjects:
  - { kind: ServiceAccount, name: ai-rca, namespace: finops }
