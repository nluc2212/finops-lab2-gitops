apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-exporter
  labels: { app: redis-exporter, lab2/note: tuning }
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis-exporter }
  template:
    metadata:
      labels: { app: redis-exporter }
    spec:
      containers:
        - name: exporter
          image: oliver006/redis_exporter:v1.67.0
          env:
            - name: REDIS_ADDR
              value: redis://redis-cart:6379
          ports:
            - { name: metrics, containerPort: 9121 }
          resources:
            requests: { cpu: 10m, memory: 24Mi }
            limits: { cpu: 100m, memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: redis-exporter
  labels: { app: redis-exporter }
spec:
  selector: { app: redis-exporter }
  ports:
    - { name: metrics, port: 9121, targetPort: metrics }
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: redis-exporter
spec:
  selector:
    matchLabels: { app: redis-exporter }
  endpoints:
    - port: metrics
      interval: 30s
