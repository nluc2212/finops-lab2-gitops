# Online Boutique v0.10.7 (Apache-2.0, github.com/GoogleCloudPlatform/microservices-demo), vendored in upstream/.
# Customer alpha. Tracing -> OTel Collector in ns monitoring; no public load balancer.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cust-alpha
resources:
  - namespace.yaml
  - upstream/kubernetes-manifests.yaml
  - redis-exporter.yaml
  - ai-rca-rbac.yaml
patches:
  - path: patches/tracing.yaml
  - path: patches/loadgen.yaml
  - target: { kind: Service, name: frontend-external }
    patch: |-
      - op: replace
        path: /spec/type
        value: ClusterIP
  # a rollout that cannot finish (missing image, crash loop) is reported after 2 min instead of 10: Argo CD turns
  # Degraded sooner, so the AI report of a bad deploy arrives ~4 min after the commit
  - target: { kind: Deployment }
    patch: |-
      - op: add
        path: /spec/progressDeadlineSeconds
        value: 120
images:
  - name: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/paymentservice
    newTag: v0.10.99
